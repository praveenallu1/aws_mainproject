name: Terraform plan or apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub/AWS environment
        required: true
        type: choice
        options: [dev, prod]
      apply:
        description: Apply the reviewed plan
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'cloudops-capstone' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: terraform-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize encrypted remote state
        run: |
          terraform -chdir=infrastructure init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${PROJECT_NAME}/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Plan
        run: |
          terraform -chdir=infrastructure plan \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -var="container_image=${{ vars.CONTAINER_IMAGE }}" \
            -out=tfplan

      - name: Apply reviewed plan
        if: inputs.apply
        run: terraform -chdir=infrastructure apply -auto-approve tfplan
